<!DOCTYPE html>
<html lang="pt-br">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Admin - Orfanato dos Gatos</title>

    <link rel="stylesheet" href="adocoes.css">
    <link rel="stylesheet" href="style.css">

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">

    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

    <style>

        .admin-topbar{
            background:#2b2b2b;
            color:white;
            padding:10px 40px;
            display:flex;
            align-items:center;
            justify-content:space-between;
            font-size:13px;
        }

        .admin-topbar-btns{
            display:flex;
            gap:10px;
        }

        .admin-topbar button{
            background:#76bea7;
            color:white;
            border:none;
            padding:6px 14px;
            border-radius:6px;
            font-size:12px;
            font-weight:600;
            cursor:pointer;
            font-family:'Poppins',sans-serif;
        }

        #btn-logout{
            background:#e74c3c !important;
        }

        .admin-container{
            width:900px;
            margin:40px auto;
        }

        .form-cadastro{
            background:white;
            border-radius:12px;
            padding:30px;
            margin-bottom:40px;
            display:flex;
            flex-direction:column;
            gap:14px;
        }

        .form-cadastro input,
        .form-cadastro textarea{
            padding:10px;
            border:1px solid #ccc;
            border-radius:6px;
            font-family:inherit;
        }

        .form-cadastro button{
            background:#76bea7;
            color:white;
            border:none;
            padding:12px;
            border-radius:6px;
            font-weight:600;
            cursor:pointer;
        }

        .form-cadastro button:hover{
            background:#5fa18d;
        }

        .lista-gatos{
            display:grid;
            grid-template-columns:repeat(3,1fr);
            gap:20px;
        }

        .card-admin{
            background:white;
            border-radius:12px;
            padding:16px;
            text-align:center;
            display:flex;
            flex-direction:column;
            overflow:hidden;
        }

        .card-admin img{
            width:100%;
            height:160px;
            object-fit:cover;
            border-radius:8px;
            flex-shrink:0;
        }

        .card-admin h3{
            margin:10px 0 6px;
            white-space:nowrap;
            overflow:hidden;
            text-overflow:ellipsis;
        }

        .card-admin p{
            font-size:13px;
            color:#555;
            overflow:hidden;
            display:-webkit-box;
            -webkit-line-clamp:3;
            -webkit-box-orient:vertical;
            text-overflow:ellipsis;
            margin:0;
            flex:1;
        }

        .btn-excluir{
            margin-top:10px;
            background:#e74c3c;
            color:white;
            border:none;
            padding:8px 14px;
            border-radius:6px;
            cursor:pointer;
        }

        .btn-excluir:hover{
            background:#c0392b;
        }

        #mensagem-status{
            margin-bottom:20px;
            font-weight:600;
        }

        .card-admin{
            cursor:pointer;
            transition:.2s;
        }

        .card-admin:hover{
            transform:scale(1.02);
            box-shadow:0 6px 18px rgba(0,0,0,.12);
        }

        /* MODAL */
        .modal-overlay{
            display:none;
            position:fixed;
            inset:0;
            background:rgba(0,0,0,.7);
            z-index:1000;
            justify-content:center;
            align-items:center;
        }

        .modal-overlay.ativo{ display:flex; }

        .modal-box{
            background:white;
            border-radius:16px;
            width:500px;
            max-width:90vw;
            overflow:hidden;
            position:relative;
            animation:aparecer .2s ease;
        }

        @keyframes aparecer{
            from{ transform:scale(.9); opacity:0; }
            to{ transform:scale(1); opacity:1; }
        }

        .modal-box img{
            width:100%;
            height:260px;
            object-fit:cover;
        }

        .modal-info{
            padding:20px 24px 24px;
        }

        .modal-info h2{
            font-size:20px;
            font-weight:700;
            margin-bottom:8px;
        }

        .modal-info p{
            font-size:14px;
            color:#555;
            line-height:1.6;
            max-height:140px;
            overflow-y:auto;
            overflow-x:hidden;
            word-break:break-word;
            white-space:pre-wrap;
            padding-right:6px;
        }

        .modal-fechar{
            position:absolute;
            top:10px;
            right:14px;
            background:rgba(0,0,0,.5);
            color:white;
            border:none;
            border-radius:50%;
            width:30px;
            height:30px;
            font-size:18px;
            cursor:pointer;
            display:flex;
            align-items:center;
            justify-content:center;
        }

    </style>

</head>

<body>

<header>

    <div class="logo">
        <a href="index.html"><img src="img/logo.jpg" alt="Logo"></a>
    </div>

    <nav>
        <a href="index.html">HOME</a>
        <a href="adocao.html">ADOÇÕES</a>
        <a href="admin.html">ADMIN</a>
        <a href="contato.html">CONTATO</a>
    </nav>

</header>

<!-- Barra do admin -->
<div class="admin-topbar">
    <span>👤 Logado como <strong id="nome-admin"></strong></span>
    <div class="admin-topbar-btns">
        <button id="btn-abrir-trocar-senha">🔑 Trocar senha</button>
        <button id="btn-logout">Sair</button>
    </div>
</div>

<!-- Modal trocar senha -->
<div id="modal-senha-overlay" class="modal-overlay">
    <div class="modal-box" style="max-width:380px">
        <button class="modal-fechar" id="fechar-modal-senha">&times;</button>
        <div class="modal-info">
            <h2 style="margin-bottom:20px">Trocar senha</h2>
            <div style="display:flex;flex-direction:column;gap:12px">
                <input type="password" id="senha-atual" placeholder="Senha atual"
                    style="padding:10px;border:1.5px solid #ddd;border-radius:8px;font-family:inherit;font-size:14px">
                <input type="password" id="nova-senha" placeholder="Nova senha (mín. 6 caracteres)"
                    style="padding:10px;border:1.5px solid #ddd;border-radius:8px;font-family:inherit;font-size:14px">
                <input type="password" id="confirmar-senha" placeholder="Confirmar nova senha"
                    style="padding:10px;border:1.5px solid #ddd;border-radius:8px;font-family:inherit;font-size:14px">
                <button id="btn-trocar-senha"
                    style="background:#76bea7;color:white;border:none;padding:12px;border-radius:8px;font-weight:600;cursor:pointer;font-family:inherit;font-size:14px">
                    Salvar nova senha
                </button>
                <p id="msg-trocar-senha" style="font-size:13px;min-height:18px;text-align:center"></p>
            </div>
        </div>
    </div>
</div>

<div class="admin-container">

    <h2>Cadastrar novo gato</h2>

    <form id="form-gato" class="form-cadastro" enctype="multipart/form-data">

        <input type="text" name="nome" placeholder="Nome do gato" required>
        <textarea name="descricao" placeholder="Descrição" rows="3" required></textarea>
        <input type="file" name="imagem" accept="image/*">
        <button type="submit">Cadastrar</button>

    </form>

    <p id="mensagem-status"></p>

    <h2>Gatos cadastrados</h2>

    <div class="lista-gatos" id="lista-gatos">
        <!-- Preenchido via JS -->
    </div>

</div>






<!-- Modal -->
<div id="modal-overlay" class="modal-overlay">
    <div class="modal-box">
        <button class="modal-fechar" id="modal-fechar">&times;</button>
        <img id="modal-img" src="" alt="">
        <div class="modal-info">
            <h2 id="modal-nome"></h2>
            <p id="modal-descricao"></p>
        </div>
    </div>
</div>

<script src="js/admin.js"></script>

</body>
</html>
