<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contato - Orfanato dos Gatos</title>

    <link rel="stylesheet" href="contato.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
</head>

<body>

    <!-- Cabeçalho -->
    <header>

        <div class="logo">
            <img src="img/logo.png" alt="Logo">
        </div>

        <nav>

            <a href="index.html">HOME</a>
            <a href="adocao.html">ADOÇÕES</a>
            <a href="#">AJUDE-NOS</a>
            <a href="contato.html">CONTATO</a>

        </nav>

    </header>

    <!-- Conteúdo -->

    <main class="banner">

        <img src="img/banner-contato.jpg" class="banner-bg" alt="Banner">

        <section class="contato-box">

            <div class="imagem-gato">

                <img src="img/gato-contato.png" alt="Gato">

            </div>

            <div class="formulario">

                <form>

                    <label>Nome Completo</label>
                    <input type="text">

                    <label>Telefone</label>
                    <input type="tel">

                    <label>E-mail</label>
                    <input type="email">

                    <label>CPF</label>
                    <input type="text">

                    <div class="linha">

                        <div>
                            <label>Estado</label>
                            <input type="text">
                        </div>

                        <div>
                            <label>Cidade</label>
                            <input type="text">
                        </div>

                    </div>

                    <label>Gostaria de...</label>
                    <textarea rows="3"></textarea>

                    <button type="submit">
                        Enviar
                    </button>

                </form>

            </div>

        </section>

    </main>

    <!-- Rodapé -->

    <footer>

        <i class="fab fa-whatsapp"></i>
        <i class="fab fa-instagram"></i>
        <i class="fas fa-location-dot"></i>

    </footer>

</body>

</html>
